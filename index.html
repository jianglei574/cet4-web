  <div class="mx-auto max-w-md min-h-screen flex flex-col shadow-xl bg-amber-50">

    <!-- 顶栏 -->
    <header class="px-5 pt-6 pb-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <svg class="w-9 h-9" aria-hidden="true"><use href="#shinchan"/></svg>
        <div>
          <h1 class="text-xl font-bold text-slate-800 font-display" id="viewTitle">今日</h1>
          <p class="text-xs text-slate-400" id="viewSubtitle">开始今天的背单词吧</p>
        </div>
      </div>
      <div class="flex items-center gap-1 text-sm font-semibold text-orange-500 bg-orange-100 rounded-full px-3 py-1">
        <span>🔥</span><span id="headerStreak">0</span><span class="text-slate-400 font-normal">天</span>
      </div>
    </header>

    <!-- 主视图 -->
    <main class="flex-1 px-5 pb-24 overflow-y-auto">

      <!-- 今日 / 首页 -->
      <section id="view-today" class="view">
        <!-- 打卡卡片 -->
        <div class="relative rounded-3xl bg-gradient-to-br from-red-400 via-red-500 to-orange-400 text-white p-6 shadow-lg shadow-red-100 overflow-hidden">
          <svg class="absolute top-3 right-3 w-12 h-12 text-yellow-200/80" aria-hidden="true"><use href="#scribble"/></svg>
          <svg class="absolute bottom-3 left-3 w-10 h-10 text-white/30 rotate-180" aria-hidden="true"><use href="#scribble"/></svg>
          <div class="relative flex items-start justify-between">
            <div>
              <p class="text-sm text-red-50">连续打卡</p>
              <p class="text-4xl font-extrabold mt-1 font-display"><span id="todayStreak">0</span><span class="text-lg font-medium"> 天</span></p>
            </div>
            <div class="flex flex-col items-end">
              <div class="bg-white text-slate-700 text-xs font-medium rounded-2xl rounded-br-none px-3 py-1.5 shadow">嗨！一起背单词吧～</div>
              <svg class="hero-shinchan mt-2" aria-hidden="true"><use href="#shinchan"/></svg>
            </div>
          </div>
          <div class="relative mt-5 grid grid-cols-3 gap-2 text-center">
            <div class="bg-white/15 rounded-xl py-3">
              <p class="text-xl font-bold" id="todayLearned">0</p>
              <p class="text-xs text-red-50">已学</p>
            </div>
            <div class="bg-white/15 rounded-xl py-3">
              <p class="text-xl font-bold" id="todayMastered">0</p>
              <p class="text-xs text-red-50">已掌握</p>
            </div>
            <div class="bg-white/15 rounded-xl py-3">
              <p class="text-xl font-bold" id="todayNewCount">0</p>
              <p class="text-xs text-red-50">今日新学</p>
            </div>
          </div>
        </div>

        <!-- 学习入口 -->
        <div class="mt-5 space-y-3">
          <button id="btnLearnNew" class="w-full flex items-center justify-between rounded-2xl bg-white p-4 shadow-sm hover:shadow-md transition">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-xl bg-rose-100 flex items-center justify-center">
                <svg class="w-7 h-7" aria-hidden="true"><use href="#shinchan-learn"/></svg>
              </div>
              <div class="text-left">
                <p class="font-semibold">学习新词</p>
                <p class="text-xs text-slate-400">认识新的四级单词</p>
              </div>
            </div>
            <span class="text-sm font-bold text-red-500" id="newCountBadge">0</span>
          </button>

          <button id="btnReview" class="w-full flex items-center justify-between rounded-2xl bg-white p-4 shadow-sm hover:shadow-md transition">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-xl bg-rose-100 flex items-center justify-center">
                <svg class="w-7 h-7" aria-hidden="true"><use href="#shinchan-stats"/></svg>
              </div>
              <div class="text-left">
                <p class="font-semibold">复习单词</p>
                <p class="text-xs text-slate-400">按艾宾浩斯曲线巩固记忆</p>
              </div>
            </div>
            <span class="text-sm font-bold text-red-500" id="reviewCountBadge">0</span>
          </button>
        </div>

        <p class="text-center text-xs text-slate-400 mt-6">共 <span id="todayTotal">0</span> 个单词，已累计学习 <span id="todayTotalStudy">0</span> 次</p>
      </section>

      <!-- 学习 / 复习 -->
      <section id="view-study" class="view hidden">
        <!-- 学习首页：选择学习内容 -->
        <div id="studyHome">
          <p class="text-center text-slate-400 text-sm mb-4">选择今天的学习内容</p>
          <div class="space-y-3">
            <button id="btnLearnNew2" class="w-full flex items-center justify-between rounded-2xl bg-white p-4 shadow-sm hover:shadow-md transition">
              <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-rose-100 flex items-center justify-center">
                  <svg class="w-7 h-7" aria-hidden="true"><use href="#shinchan-learn"/></svg>
                </div>
                <div class="text-left"><p class="font-semibold">学习新词</p><p class="text-xs text-slate-400">认识新的四级单词</p></div>
              </div>
              <span class="text-sm font-bold text-red-500" id="newCountBadge2">0</span>
            </button>
            <button id="btnReview2" class="w-full flex items-center justify-between rounded-2xl bg-white p-4 shadow-sm hover:shadow-md transition">
              <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-rose-100 flex items-center justify-center">
                  <svg class="w-7 h-7" aria-hidden="true"><use href="#shinchan-stats"/></svg>
                </div>
                <div class="text-left"><p class="font-semibold">复习单词</p><p class="text-xs text-slate-400">按艾宾浩斯曲线巩固记忆</p></div>
              </div>
              <span class="text-sm font-bold text-red-500" id="reviewCountBadge2">0</span>
            </button>
          </div>
        </div>

        <!-- 学习会话 -->
        <div id="studySession" class="hidden">
        <div class="flex items-center justify-between mb-3">
          <button id="btnExitStudy" class="text-sm text-slate-400 hover:text-slate-600">← 退出</button>
          <span class="text-sm font-semibold text-slate-500" id="studyProgressText">1 / 10</span>
        </div>
        <div class="w-full h-2 bg-slate-200 rounded-full overflow-hidden mb-5">
          <div id="studyProgressBar" class="h-full bg-red-500 rounded-full transition-all" style="width: 0%"></div>
        </div>

        <!-- 学习 / 复习统一四选一 -->
        <div id="studyQuizArea">
          <div class="rounded-2xl bg-white p-6 shadow-sm text-center mb-4">
            <p class="text-xs text-slate-400 mb-2">选择正确的释义</p>
            <div class="flex items-center justify-center gap-3">
              <p class="text-3xl font-bold text-slate-800 break-words" id="quizWord">word</p>
              <button id="btnSpeak" class="shrink-0 w-11 h-11 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center hover:bg-rose-200 transition" title="点击发音">🔊</button>
            </div>
          </div>
          <button id="btnToggleNotebook" class="w-full mb-3 py-2.5 rounded-xl bg-white shadow-sm font-medium text-slate-600 hover:shadow-md transition">☆ 标记生词</button>
          <div id="quizOptions" class="space-y-3"></div>
          <div id="quizFeedback" class="hidden mt-5 rounded-2xl p-4 text-sm"></div>
          <button id="btnNextQuiz" class="hidden w-full mt-4 py-3 rounded-xl bg-red-500 text-white font-semibold hover:bg-red-600 transition">下一题 →</button>
        </div>
        </div>
      </section>

      <!-- 生词本 -->
      <section id="view-notebook" class="view hidden">
        <div class="flex items-center justify-between mb-4">
          <p class="text-sm text-slate-400">收藏了 <span id="notebookCount" class="font-bold text-slate-600">0</span> 个生词</p>
        </div>
        <div id="notebookEmpty" class="hidden text-center py-16 text-slate-400">
          <svg class="w-24 h-24 mx-auto mb-3 opacity-90" aria-hidden="true"><use href="#shinchan-notebook"/></svg>
          <p>还没有生词，学习时点击「标记生词」收藏</p>
        </div>
        <div id="notebookList" class="space-y-2"></div>
      </section>

      <!-- 统计 -->
      <section id="view-stats" class="view hidden">
        <div class="grid grid-cols-2 gap-3 mb-5">
          <div class="rounded-2xl bg-white p-4 shadow-sm text-center">
            <p class="text-2xl font-bold text-orange-500" id="statsStreak">0</p>
            <p class="text-xs text-slate-400">连续打卡</p>
          </div>
          <div class="rounded-2xl bg-white p-4 shadow-sm text-center">
            <p class="text-2xl font-bold text-red-500" id="statsMastered">0</p>
            <p class="text-xs text-slate-400">已掌握</p>
          </div>
          <div class="rounded-2xl bg-white p-4 shadow-sm text-center">
            <p class="text-2xl font-bold text-red-500" id="statsLearned">0</p>
            <p class="text-xs text-slate-400">已学习</p>
          </div>
          <div class="rounded-2xl bg-white p-4 shadow-sm text-center">
            <p class="text-2xl font-bold text-slate-700" id="statsTotalStudy">0</p>
            <p class="text-xs text-slate-400">累计学习次数</p>
          </div>
        </div>

        <h2 class="text-sm font-semibold text-slate-600 mb-3">最近打卡</h2>
        <div class="rounded-2xl bg-white p-4 shadow-sm">
          <div id="heatmap" class="grid grid-cols-7 gap-1.5"></div>
          <div class="flex items-center justify-end gap-1 mt-3 text-xs text-slate-400">
            <span>少</span>
            <span class="w-3 h-3 rounded bg-slate-100"></span>
            <span class="w-3 h-3 rounded bg-emerald-200"></span>
            <span class="w-3 h-3 rounded bg-emerald-400"></span>
            <span class="w-3 h-3 rounded bg-emerald-600"></span>
            <span>多</span>
          </div>
        </div>

        <button id="btnReset" class="w-full mt-5 py-2.5 rounded-xl bg-white text-slate-400 text-sm shadow-sm hover:text-rose-500 transition">重置所有学习数据</button>
      </section>

    </main>

    <!-- 底部导航 -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white/95 backdrop-blur border-t border-slate-200 flex">
      <button class="nav-tab" data-view="today">
        <svg class="nav-icon" aria-hidden="true"><use href="#shinchan-home"/></svg>
        <span>今日</span>
      </button>
      <button class="nav-tab" data-view="study">
        <svg class="nav-icon" aria-hidden="true"><use href="#shinchan-learn"/></svg>
        <span>学习</span>
      </button>
      <button class="nav-tab" data-view="notebook">
        <svg class="nav-icon" aria-hidden="true"><use href="#shinchan-notebook"/></svg>
        <span>生词本</span>
      </button>
      <button class="nav-tab" data-view="stats">
        <svg class="nav-icon" aria-hidden="true"><use href="#shinchan-stats"/></svg>
        <span>统计</span>
      </button>
    </nav>
  </div>

  <script src="dataService.js"></script>
  <script src="app.js"></script>
</body>
</html>
