          <svg class="absolute bottom-3 left-3 w-10 h-10 text-white/30 rotate-180" aria-hidden="true"><use href="#scribble"/></svg>
          <svg class="sparkle absolute top-6 right-20 w-5 h-5 text-yellow-200" aria-hidden="true"><use href="#sparkle"/></svg>
          <svg class="sparkle absolute top-20 right-4 w-3 h-3 text-white/70" style="animation-delay:.8s" aria-hidden="true"><use href="#sparkle"/></svg>
          <div class="relative flex items-start justify-between">
            <div>
              <p class="text-sm text-red-50">连续打卡</p>
              <p class="text-4xl font-extrabold mt-1"><span id="todayStreak" class="font-num streak-beat">0</span><span class="text-lg font-medium"> 天</span></p>
            </div>
            <div class="flex flex-col items-end">
              <div id="bubble" class="bubble bg-white text-slate-700 text-xs font-medium rounded-2xl rounded-br-none px-3 py-1.5 shadow">嗨！一起背单词吧～</div>
              <button id="mascotHero" class="mascot-btn mt-2" aria-label="摸摸小新">
                <svg class="hero-shinchan" aria-hidden="true"><use href="#shinchan"/></svg>
              </button>
            </div>
          </div>
          <div class="relative mt-5 grid grid-cols-3 gap-2 text-center">
            <div class="bg-white/15 rounded-xl py-3">
              <p class="text-xl font-bold font-num" id="todayLearned">0</p>
              <p class="text-xs text-red-50">已学</p>
            </div>
            <div class="bg-white/15 rounded-xl py-3">
              <p class="text-xl font-bold font-num" id="todayMastered">0</p>
              <p class="text-xs text-red-50">已掌握</p>
            </div>
            <div class="bg-white/15 rounded-xl py-3">
              <p class="text-xl font-bold font-num" id="todayNewCount">0</p>
              <p class="text-xs text-red-50">今日新学</p>
            </div>
          </div>
        </div>

        <!-- 学习入口 -->
        <div class="mt-5 space-y-3">
          <button id="btnLearnNew" class="entry-card">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-xl bg-rose-100 flex items-center justify-center">
                <svg class="w-7 h-7" aria-hidden="true"><use href="#shinchan-learn"/></svg>
              </div>
              <div class="text-left">
                <p class="font-semibold">学习新词</p>
                <p class="text-xs text-slate-400">认识新的四级单词</p>
              </div>
            </div>
            <span class="badge badge-lg border-0 font-num" id="newCountBadge">0</span>
          </button>

          <button id="btnReview" class="entry-card">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-xl bg-amber-100 flex items-center justify-center">
                <svg class="w-7 h-7" aria-hidden="true"><use href="#shinchan-stats"/></svg>
              </div>
              <div class="text-left">
                <p class="font-semibold">复习单词</p>
                <p class="text-xs text-slate-400">按艾宾浩斯曲线巩固记忆</p>
              </div>
            </div>
            <span class="badge badge-lg border-0 font-num" id="reviewCountBadge">0</span>
          </button>
        </div>

        <p class="text-center text-xs text-slate-400 mt-6">共 <span id="todayTotal" class="font-num">0</span> 个单词，已累计学习 <span id="todayTotalStudy" class="font-num">0</span> 次</p>
      </section>

      <!-- 学习 / 复习 -->
      <section id="view-study" class="view hidden">
        <!-- 学习首页：选择学习内容 -->
        <div id="studyHome">
          <p class="text-center text-slate-400 text-sm mb-4">选择今天的学习内容</p>
          <div class="space-y-3">
            <button id="btnLearnNew2" class="entry-card">
              <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-rose-100 flex items-center justify-center">
                  <svg class="w-7 h-7" aria-hidden="true"><use href="#shinchan-learn"/></svg>
                </div>
                <div class="text-left"><p class="font-semibold">学习新词</p><p class="text-xs text-slate-400">认识新的四级单词</p></div>
              </div>
              <span class="badge badge-lg border-0 font-num" id="newCountBadge2">0</span>
            </button>
            <button id="btnReview2" class="entry-card">
              <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-amber-100 flex items-center justify-center">
                  <svg class="w-7 h-7" aria-hidden="true"><use href="#shinchan-stats"/></svg>
                </div>
                <div class="text-left"><p class="font-semibold">复习单词</p><p class="text-xs text-slate-400">按艾宾浩斯曲线巩固记忆</p></div>
              </div>
              <span class="badge badge-lg border-0 font-num" id="reviewCountBadge2">0</span>
            </button>
          </div>
        </div>

        <!-- 学习会话 -->
        <div id="studySession" class="hidden">
          <div class="flex items-center justify-between mb-3">
            <button id="btnExitStudy" class="btn btn-ghost btn-sm normal-case text-slate-400">← 退出</button>
            <span class="text-sm font-semibold text-slate-500 font-num" id="studyProgressText">1 / 10</span>
          </div>
          <progress id="studyProgressBar" class="progress w-full h-3" value="0" max="100"></progress>

          <!-- 学习 / 复习统一四选一 -->
          <div id="studyQuizArea" class="mt-5">
            <div class="rounded-3xl bg-white p-6 shadow-sm text-center">
              <p class="text-xs text-slate-400 mb-2">选择正确的释义</p>
              <div class="flex items-center justify-center gap-3">
                <p class="text-3xl font-bold text-slate-800 break-words font-num" id="quizWord">word</p>
                <button id="btnSpeak" class="shrink-0 w-11 h-11 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center hover:bg-rose-200 transition" title="点击发音">🔊</button>
              </div>
            </div>
            <button id="btnToggleNotebook" class="w-full mt-3 mb-3 py-2.5 rounded-xl bg-white shadow-sm font-medium text-slate-600 hover:shadow-md transition">☆ 标记生词</button>
            <div id="quizOptions" class="space-y-3"></div>
            <div id="quizFeedback" class="hidden mt-5">
              <div id="quizFeedbackAlert" class="alert rounded-2xl shadow-sm">
                <svg id="feedbackMascot" class="w-12 h-12 shrink-0" aria-hidden="true"><use href="#shinchan"/></svg>
                <div id="feedbackBody" class="text-sm"></div>
              </div>
            </div>
            <button id="btnNextQuiz" class="hidden w-full mt-4 btn rounded-full">下一题 →</button>
          </div>
        </div>
      </section>

      <!-- 生词本 -->
      <section id="view-notebook" class="view hidden">
        <div class="flex items-center justify-between mb-4">
          <p class="text-sm text-slate-400">收藏了 <span id="notebookCount" class="font-bold text-slate-600 font-num">0</span> 个生词</p>
        </div>
        <div id="notebookEmpty" class="hidden text-center py-16 text-slate-400">
          <svg class="w-24 h-24 mx-auto mb-3 opacity-90 sway" aria-hidden="true"><use href="#shinchan-notebook"/></svg>
          <p>还没有生词，学习时点击「标记生词」收藏</p>
        </div>
        <div id="notebookList" class="space-y-2"></div>
      </section>

      <!-- 统计 -->
      <section id="view-stats" class="view hidden">
        <div class="grid grid-cols-2 gap-3 mb-5">
          <div class="stat bg-base-100 rounded-2xl shadow-sm text-center">
            <div class="stat-value text-orange-500 font-num" id="statsStreak">0</div>
            <div class="stat-title">连续打卡</div>
          </div>
          <div class="stat bg-base-100 rounded-2xl shadow-sm text-center">
            <div class="stat-value text-rose-500 font-num" id="statsMastered">0</div>
            <div class="stat-title">已掌握</div>
          </div>
          <div class="stat bg-base-100 rounded-2xl shadow-sm text-center">
            <div class="stat-value text-rose-500 font-num" id="statsLearned">0</div>
            <div class="stat-title">已学习</div>
          </div>
          <div class="stat bg-base-100 rounded-2xl shadow-sm text-center">
            <div class="stat-value text-slate-700 font-num" id="statsTotalStudy">0</div>
            <div class="stat-title">累计学习次数</div>
          </div>
        </div>

        <h2 class="text-sm font-semibold text-slate-600 mb-3">最近打卡</h2>
        <div class="rounded-2xl bg-white p-4 shadow-sm">
          <div id="heatmap" class="grid grid-cols-7 gap-1.5"></div>
          <div class="flex items-center justify-end gap-1 mt-3 text-xs text-slate-400">
            <span>少</span>
            <span class="w-3 h-3 rounded bg-slate-100"></span>
            <span class="w-3 h-3 rounded bg-emerald-200"></span>
            <span class="w-3 h-3 rounded bg-emerald-400"></span>
            <span class="w-3 h-3 rounded bg-emerald-600"></span>
            <span>多</span>
          </div>
        </div>

        <button id="btnReset" class="w-full mt-5 btn btn-ghost normal-case text-slate-400 hover:text-rose-500">重置所有学习数据</button>
      </section>

    </main>

    <!-- 底部导航 -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white/85 backdrop-blur border-t border-rose-100 flex">
      <button class="nav-tab" data-view="today">
        <svg class="nav-icon" aria-hidden="true"><use href="#shinchan-home"/></svg>
        <span>今日</span>
      </button>
      <button class="nav-tab" data-view="study">
        <svg class="nav-icon" aria-hidden="true"><use href="#shinchan-learn"/></svg>
        <span>学习</span>
      </button>
      <button class="nav-tab" data-view="notebook">
        <svg class="nav-icon" aria-hidden="true"><use href="#shinchan-notebook"/></svg>
        <span>生词本</span>
      </button>
      <button class="nav-tab" data-view="stats">
        <svg class="nav-icon" aria-hidden="true"><use href="#shinchan-stats"/></svg>
        <span>统计</span>
      </button>
    </nav>
  </div>

  <!-- 重置确认弹窗 -->
  <dialog id="resetModal" class="modal">
    <div class="modal-box text-center">
      <h3 class="font-bold text-lg font-display">确定要清空所有学习记录吗？</h3>
      <p class="py-4 text-sm text-slate-500">此操作不可恢复。</p>
      <div class="modal-action justify-center">
        <button id="resetCancel" class="btn">再想想</button>
        <button id="resetConfirm" class="btn btn-error">确定清空</button>
      </div>
    </div>
  </dialog>

  <!-- 学习完成弹窗 -->
  <dialog id="doneModal" class="modal">
    <div class="modal-box text-center">
      <svg class="w-16 h-16 mx-auto" aria-hidden="true"><use href="#shinchan-happy"/></svg>
      <h3 id="doneModalTitle" class="font-bold text-lg mt-2 font-display">本轮新词学完啦！</h3>
      <p id="doneModalBody" class="py-3 text-sm text-slate-500"></p>
      <div class="modal-action justify-center">
        <button id="doneClose" class="btn rounded-full">继续加油</button>
      </div>
    </div>
  </dialog>

  <!-- DaisyUI toast 容器 -->
  <div class="toast toast-top toast-center z-[70]" id="toastWrap"></div>

  <!-- 工具库：canvas-confetti（庆祝）、CountUp（数字滚动） -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/countup.js@2.10.1/dist/countUp.umd.js"></script>
  <script src="dataService.js"></script>
  <script src="app.js"></script>
</body>
</html>
