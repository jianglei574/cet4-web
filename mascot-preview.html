<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咕噜 · 形象小样</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#fff7ee 0%,#ffeede 100%);color:#3a2f28;min-height:100vh}
  .wrap{max-width:760px;margin:0 auto;padding:40px 20px 64px;text-align:center}
  h1{font-size:24px;margin:0 0 6px}
  .sub{color:#9a8a78;font-size:14px;margin:0 0 8px}
  .note{background:#fff2e6;border:1px solid #ffdcc8;border-radius:12px;padding:12px 16px;font-size:13px;color:#8a6f5a;line-height:1.7;margin:24px auto 0;max-width:520px;text-align:left}
  .stage{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap;padding:24px 0 8px}
  .box{display:flex;flex-direction:column;align-items:center;gap:10px;background:#fff;border:1px solid #eee0d2;border-radius:18px;padding:20px 26px;box-shadow:0 6px 20px rgba(120,80,40,.07)}
  .box svg{width:172px;height:172px}
  .label{font-size:14px;font-weight:600;color:#8a6f5a}
  .grow-arrow{font-size:13px;color:#b09c86;line-height:1.7;text-align:center}
  .grow-arrow b{display:block;font-size:15px;color:#ff7a6b}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎨 咕噜 · 形象小样</h1>
  <p class="sub">雪白团子 · 大眼 · 两片大叶子插头顶 · 圆圈手 + 圆圈脚</p>

  <div class="stage">
    <div class="box">
      <svg viewBox="0 0 220 220" aria-label="基础馒头形象"><use href="#gulu-half"/></svg>
      <div class="label">基础 · 馒头形</div>
    </div>
    <div class="grow-arrow">打卡多天<br><b>长大 ↓</b><br>长成圆球</div>
    <div class="box">
      <svg viewBox="0 0 220 220" aria-label="长大圆球形象"><use href="#gulu-ball"/></svg>
      <div class="label">长大 · 圆球</div>
    </div>
  </div>

  <div class="note">
    这版：长大后的圆球<b>明显更大</b>（比基础版大一圈），手脚也<b>加长</b>了；身体是不规则软团子、手脚带自然弧度、都是小圆圈。
    看看顺不顺眼。
  </div>
</div>

</body>
</html>
